[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buildshield-ci"
version = "1.0.0"
description = "Advanced CI/CD supply-chain risk analyzer and dependency confusion defense platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Saketh", email = "rootmass56@users.noreply.github.com" }
]
keywords = [
    "cybersecurity",
    "devsecops",
    "supply-chain-security",
    "dependency-confusion",
    "github-actions",
    "ci-cd",
    "sarif",
    "policy-as-code",
    "fastapi",
    "security-dashboard"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "PyYAML>=6.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "httpx2>=2.0.0",
    "build>=1.2.2",
    "cyclonedx-bom==7.4.0",
    "mypy>=1.15.0,<2.0",
    "pytest-cov>=6.0.0",
    "pip-tools==7.6.1",
    "ruff>=0.11.0,<1.0"
]

[project.urls]
Homepage = "https://github.com/rootmass56/buildshield-ci"
Repository = "https://github.com/rootmass56/buildshield-ci"
Issues = "https://github.com/rootmass56/buildshield-ci/issues"

[project.scripts]
buildshield = "supplysentinel.cli:app"
supplysentinel = "supplysentinel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "build",
    "dist",
    "frontend"
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["supplysentinel"]

[tool.coverage.report]
show_missing = true
skip_covered = true
